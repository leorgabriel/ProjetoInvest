<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ProjetoInvest">
<meta name="theme-color" content="#0A0A0C">
<title>ProjetoInvest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div id="login">
  <div class="logo">&#128176;</div>
  <h1 id="lTitulo">Entrar</h1>
  <p class="mu" id="lSub">Acesse sua conta para continuar.</p>

  <div class="seg lseg" id="lModo">
    <button type="button" data-m="entrar" class="on">Entrar</button>
    <button type="button" data-m="criar">Criar conta</button>
  </div>

  <label class="campo hide" id="boxNome"><span>Nome</span>
    <input id="lNome" class="inp" autocomplete="name" placeholder="Como quer ser chamado"></label>

  <label class="campo"><span>E-mail</span>
    <input id="lEmail" class="inp" type="email" inputmode="email" autocapitalize="off"
      autocorrect="off" autocomplete="username" placeholder="nome@exemplo.com"></label>

  <label class="campo"><span>Senha</span>
    <input id="lSenha" class="inp" type="password" autocomplete="current-password"
      placeholder="Pelo menos 6 caracteres"></label>

  <label class="campo hide" id="boxConf"><span>Repita a senha</span>
    <input id="lConf" class="inp" type="password" autocomplete="new-password"></label>

  <label class="sw lver">Mostrar senha<input type="checkbox" id="lVer"></label>

  <button class="btn" id="lAcao">Entrar</button>
  <button type="button" class="btn-txt" id="lEsqueci">Esqueci minha senha</button>
  <div id="lMsg" class="lmsg"></div>
</div>

<div id="app" class="hide">
  <header>
    <div class="topo">
      <button type="button" id="tMes" class="topoMes">Mês</button>
      <button id="bSair" class="chip" style="padding:6px 11px">Sair</button>
    </div>
  </header>

  <main class="wrap">
    <section class="tela on" id="t-mes"><div class="carregando">Carregando…</div></section>
    <section class="tela" id="t-ano"><div class="carregando">Carregando…</div></section>
    <section class="tela" id="t-guardado"><div class="carregando">Carregando…</div></section>
    <section class="tela" id="t-cadastros"><div class="carregando">Carregando…</div></section>
  </main>
</div>

<button class="fab hide" id="fab">+</button>
<nav class="hide" id="nav">
  <button data-t="mes" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Mês</button>
  <button data-t="ano"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Ano</button>
  <span></span>
  <button data-t="guardado"><svg viewBox="0 0 24 24"><path d="M3 10h18v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 10l2.5-5h13L21 10M12 14v3"/></svg>Investido</button>
  <button data-t="cadastros"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>Ajustes</button>
</nav>

<div id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
